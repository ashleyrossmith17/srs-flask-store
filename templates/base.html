<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GLOW ROOM{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}">GLOW ROOM</a>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('catalog') }}">Каталог</a>
            <a href="{{ url_for('review') }}">Отзывы</a>
        </nav>
        <a class="header-link" href="{{ url_for('catalog') }}">Найти средство</a>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
        <strong>GLOW ROOM</strong>
        <span>Уход и макияж без лишнего</span>
        <span>Учебный проект на Flask</span>
    </footer>
</body>
</html>
